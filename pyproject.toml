[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-landing-page"
version = "2.0.0"
description = "HF Markets registration & login (Django + Django REST Framework + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28,<1",
    "argon2-cffi>=25.1,<26",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-cov>=6",
]

# An application, not a library: pyproject declares dependencies and tool settings only.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*", "manage.py", "config/wsgi.py", "*/migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
