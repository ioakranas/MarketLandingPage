[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-landing-page"
version = "1.0.0"
description = "HF Markets registration & login landing page (Flask + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "argon2-cffi>=25.1,<26",
    "flask-wtf>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["schema.sql", "templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
