{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HF Markets{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="brand" href="{% url 'register' %}">
                <span class="brand__tagline">Member of HF Markets Group</span>
                <img class="brand__logo" src="{% static 'img/hfm-logo.svg' %}"
                     alt="HF Markets" width="108" height="50">
            </a>
            <nav class="site-header__action" aria-label="Account">
                {% block header_action %}
                <a class="button button--outline-red button--small" href="{% url 'login' %}">Login</a>
                {% endblock %}
            </nav>
        </div>
    </header>

    <main class="hero">
        <div class="hero__content">
            <h1 class="hero__title">{% block heading %}{% endblock %}</h1>
            <section class="card {% block card_modifier %}{% endblock %}">
                {% block content %}{% endblock %}
            </section>
        </div>
    </main>
</body>
</html>
